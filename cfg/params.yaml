/**:
  ros__parameters:
    use_sim_time: true
    frames/odom: odom
    frames/baselink: base_link
    frames/lidar: lidar
    frames/imu: imu

    map/waitUntilMove: true
    map/dense/filtered: false
    map/sparse/leafSize: 0.25

    odom/gravity: 9.80665
    odom/computeTimeOffset: true

    odom/imu/approximateGravity: false
    odom/imu/calibration/gyro: true
    odom/imu/calibration/accel: true
    odom/imu/calibration/time: 3.0
    odom/imu/bufferSize: 5000

    odom/preprocessing/cropBoxFilter/size: 1.0
    odom/preprocessing/voxelFilter/res: 0.25

    odom/keyframe/threshD: 1.0
    odom/keyframe/threshR: 45.0

    odom/submap/keyframe/knn: 10
    odom/submap/keyframe/kcv: 10
    odom/submap/keyframe/kcc: 10
    odom/gicp/minNumPoints: 64
    odom/gicp/kCorrespondences: 16
    odom/gicp/maxCorrespondenceDistance: 0.5
    odom/gicp/maxIterations: 32
    odom/gicp/transformationEpsilon: 0.01
    odom/gicp/rotationEpsilon: 0.01
    odom/gicp/initLambdaFactor: 1e-9

    odom/gicp/photometricWeight: 0.1

    # Photometric channel for the GICP intensity term:
    #   intensity    - raw return strength (range-dependent); uses the range
    #                  correction below.
    #   reflectivity - calibrated reflectivity (e.g. Ouster), already range-
    #                  normalized; the range correction is skipped automatically.
    # If the chosen field is absent from the cloud, the node falls back to the
    # other channel automatically (logged once); the photometric term is disabled
    # only if neither field is present.
    odom/gicp/photometricChannel: intensity

    # Intensity range correction (only applied when photometricChannel: intensity)
    # intensityAlpha : falloff exponent (2.0 = inverse-square; tune per sensor)
    # intensityRRef  : reference range in metres (anchor; 1.0 is a safe default)
    odom/preprocessing/intensityAlpha: 2.0
    odom/preprocessing/intensityRRef: 1.0
    # Incidence-angle correction (Kashani radiometric model): additionally divide
    # intensity by max(|beam . surface_normal|, cosMin). Corrects the grazing-angle
    # darkening of distant ground/wall points that the range model alone leaves
    # (and which otherwise looks like spurious intensity gradients). Organized
    # scans only (uses the native grid for cheap normals); off by default.
    # cosMin floors the divisor to avoid blow-up at grazing angles (0.2 ~= 78 deg).
    odom/preprocessing/intensityIncidence: false
    odom/preprocessing/intensityCosMin: 0.2
    odom/gicp/gradientKNeighbors: 10

    odom/geo/Kp: 4.5
    odom/geo/Kv: 11.25
    odom/geo/Kq: 4.0
    odom/geo/Kab: 2.25
    odom/geo/Kgb: 1.0
    odom/geo/abias_max: 5.0
    odom/geo/gbias_max: 0.5
